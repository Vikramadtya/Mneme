services:
  mongodb:
    image: mongo:7
    container_name: memoriser-mongo
    ports:
      - "127.0.0.1:27017:27017" # local only; never expose the database publicly
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-memoriser}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
