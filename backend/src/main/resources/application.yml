micronaut:
  application:
    name: backend
  server:
    cors:
      enabled: false
  security:
    enabled: true
    authentication: bearer
    intercept-url-map:
      - pattern: /api/v1/health**
        access:
          - isAnonymous()
      - pattern: /api/v1/auth/**
        access:
          - isAnonymous()
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:super_secret_jwt_key_that_must_be_at_least_256_bits_long!}

mongodb:
  uri: ${MONGO_URI:`mongodb://localhost:27017/memoriser_v3`}
