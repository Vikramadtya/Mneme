name: Send review reminders

# Free hosts put the backend to sleep, so reminders are triggered from outside: this job calls the backend
# every hour, and the backend sends a reminder to everyone whose chosen hour has arrived and who has not had one today.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}   # e.g. https://memoriser.onrender.com (no trailing slash)
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BACKEND_URL / CRON_SECRET are not set; reminders are disabled."
            exit 0
          fi
          # The first request may have to wake the server, so allow time and retry once.
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$BACKEND_URL/api/v1/reminders/dispatch"
